name: Sync X (Articles + thread)

# Pushes build and validate the payloads. The one exception: a push that *adds*
# a blog post with a hand-written x.thread announces that post (once the blog
# page and hero image are live). Everything else on X is a deliberate manual run.
on:
  push:
    branches:
      - main
    paths:
      - src/content/blog/**
      - scripts/sync-x.mjs
      - scripts/lib/x-*.mjs
      - package.json
      - package-lock.json
  workflow_dispatch:
    inputs:
      action:
        description: What to do on X
        required: true
        default: build
        type: choice
        options:
          - build
          - draft
          - publish
          - thread
          - publish+thread
      slug:
        description: Limit to one x.slug (empty = every post with an `x:` key)
        required: false
        type: string
      force:
        description: Re-create even when the content hash is unchanged
        required: false
        default: false
        type: boolean

concurrency:
  group: sync-x-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Auto-post compares the pushed commits to find newly added posts.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve flags
        id: flags
        env:
          ACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.action || 'build' }}
          SLUG: ${{ inputs.slug }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          case "$ACTION" in
            build)          FLAGS="" ;;
            draft)          FLAGS="--apply" ;;
            publish)        FLAGS="--publish" ;;
            thread)         FLAGS="--thread" ;;
            publish+thread) FLAGS="--publish --thread" ;;
            *) echo "::error::Unknown action: $ACTION"; exit 1 ;;
          esac

          if [[ -n "${SLUG:-}" ]]; then FLAGS="$FLAGS --only $SLUG"; fi
          if [[ "${FORCE:-false}" == "true" ]]; then FLAGS="$FLAGS --force"; fi

          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"

      - name: Validate secrets
        if: steps.flags.outputs.action != 'build'
        run: |
          set -euo pipefail
          for name in X_API_KEY X_API_SECRET X_ACCESS_TOKEN X_ACCESS_TOKEN_SECRET; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing secret::$name is not set. Add it in Settings → Secrets and variables → Actions."
              exit 1
            fi
          done
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}

      - name: Run sync-x
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/sync-x.mjs ${{ steps.flags.outputs.flags }} | tee "$RUNNER_TEMP/sync-x.log"

      - name: Summary
        if: always()
        run: |
          {
            echo '## sync-x (${{ steps.flags.outputs.action }})'
            echo '```'
            cat "$RUNNER_TEMP/sync-x.log" 2>/dev/null || echo 'no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated payloads
        uses: actions/upload-artifact@v4
        with:
          name: x-drafts-${{ github.run_id }}
          path: .x/drafts/
          if-no-files-found: ignore

      # 記事PRがマージされたら、そのpushで新しく追加された記事の告知を自動で投稿する（2026-10-16〜）。
      # 対象は「追加された」記事だけで、既存記事の編集では投稿しない。手書きの x.thread が無い記事と、
      # x.auto: false の記事も投稿しない。ブログの記事ページとヒーロー画像が200になるまで待ち（最大10分）、
      # 開けなければ投稿しない（リンク先が404の告知や、画像なしのリンクカードは後から直せないため）。
      - name: Auto-post new articles
        id: autopost
        if: github.event_name == 'push'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          TARGETS=$(node scripts/x-new-articles.mjs "$BEFORE" "$AFTER")
          if [[ -z "$TARGETS" ]]; then
            echo "No new articles to announce."
            exit 0
          fi

          for name in X_API_KEY X_API_SECRET X_ACCESS_TOKEN X_ACCESS_TOKEN_SECRET; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing secret::$name is not set. 告知は投稿していません。"
              exit 1
            fi
          done

          BASE="${SITE_URL:-https://dev-blog-pi-six.vercel.app}"
          BASE="${BASE%/}"

          wait_for() {
            local url="$1"
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' -L "${url}?cb=$(date +%s)")
              echo "[$i] $code $url"
              if [[ "$code" == "200" ]]; then return 0; fi
              sleep 20
            done
            return 1
          }

          FAILED=0
          while IFS=$'\t' read -r slug basename hero; do
            [[ -z "$slug" ]] && continue
            echo "::group::$slug"
            if ! wait_for "$BASE/blog/$basename/"; then
              echo "::error title=X::$slug — ブログが10分待っても開けなかったので、告知は投稿していません"
              FAILED=1; echo "::endgroup::"; continue
            fi
            if [[ -n "$hero" ]] && ! wait_for "$BASE$hero"; then
              echo "::error title=X::$slug — ヒーロー画像が開けなかったので、告知は投稿していません"
              FAILED=1; echo "::endgroup::"; continue
            fi
            node scripts/sync-x.mjs --thread --only "$slug" | tee -a "$RUNNER_TEMP/sync-x.log"
            echo "::notice title=X::$slug の告知を投稿しました"
            echo "::endgroup::"
          done <<< "$TARGETS"

          echo "ran=true" >> "$GITHUB_OUTPUT"
          exit "$FAILED"

      # Article ids and thread ids live in .x/state.json; without committing it
      # back, the next run would create duplicates.
      - name: Commit state
        if: always() && (steps.flags.outputs.action != 'build' || steps.autopost.outputs.ran == 'true')
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -z "$(git status --porcelain .x/state.json)" ]]; then
            echo "state unchanged"
            exit 0
          fi

          git add .x/state.json
          git commit -m "chore: update X sync state [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
